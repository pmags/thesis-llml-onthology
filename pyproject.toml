[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontogen"
version = "0.1.0"
description = "LLM-driven ontology generation from domain descriptions"
requires-python = ">=3.10,<3.14"
dependencies = [
    "chromadb",
    "dash",
    "dash-cytoscape",
    "dash-bootstrap-components",
    "graphviz",
    "ipykernel",
    "ipython",
    "ipywidgets",
    "kglab",
    "matplotlib",
    "networkx",
    "nltk",
    "numpy",
    "openai",
    "pandas",
    "pydotplus",
    "pyodbc",
    "python-dotenv",
    "python-louvain",
    "rdflib",
    "requests",
    "scikit-learn",
    "scipy",
    "seaborn",
    "spacy"
]

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v --tb=short"
